apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: soda-tech-adapter-es
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: fake-soda
    kind: ClusterSecretStore
  target:
    name: soda-tech-adapter-secrets
  dataFrom:
    - extract:
        key: soda-tech-adapter-provisioner
