# Default values for soda-tech-adapter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Docker Registry Secret name used to access a private repo
dockerRegistrySecretName: regcred

image:
  # -- Image repository
  registry: registry.gitlab.com/agilefactory/witboost.mesh/provisioning/witboost.mesh.provisioning.dataquality.soda
  # -- Image tag
  tag: latest
  # -- The imagePullPolicy for a container and the tag of the image affect when the kubelet attempts to pull (download) the specified image.
  pullPolicy: Always

# -- Non-secret application configuration, mounted into the container as
# `config/application.yaml` (see tech-adapter/src/app_config.py -
# `SodaConfig`). When set, this full YAML string REPLACES the chart's
# default `files/application.yaml` entirely (it is not merged). Every
# resulting key becomes a `SodaConfig` field and can still be overridden
# individually by an environment variable named `SODA_<FIELD>`. Do NOT put
# secrets here.
# e.g:
# configOverride: |
#   base_url: "https://cloud.soda.io"
#   request_timeout_seconds: 30
configOverride: ""

# -- Name of a pre-existing Kubernetes Secret holding SODA_API_KEY_ID and
# SODA_API_KEY_SECRET. Leave empty to skip mounting secrets (e.g. local
# smoke tests). The secret itself is never templated by this chart; create
# it out of band (see helm/sample for an ExternalSecret example).
secretName: ""

# -- define extra variables to add to the container(s), in addition to what
# `secretName` (SODA_API_KEY_ID/SODA_API_KEY_SECRET) and `configOverride`
# already inject. You do NOT need to list the Soda credentials here.
# e.g:
# extraEnvVars:
#   - name: FOO
#     value: "10"
extraEnvVars: []

# -- readiness probe spec
readinessProbe: {}

# -- liveness probe spec
livenessProbe: {}

# -- security context spec
securityContext:
  runAsUser: 1001
  allowPrivilegeEscalation: false
  runAsNonRoot: true

# -- resources spec
resources: {}

# -- Allows you to specify common labels
labels: {}


